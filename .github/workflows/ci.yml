name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: ruff format check
        run: uv run ruff format --check src/

      - name: ruff lint
        run: uv run ruff check src/

      - name: ty type check
        run: uv run ty check

      - name: codespell
        run: uv run python -m codespell_lib src/

  compose-validate:
    name: Validate Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Compose environment
        run: cp docker/.env.template docker/.env

      - name: Validate merged compose config
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.dev.yml \
            config --quiet

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest -m unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Turso trip tests run on a stdlib sqlite file (no service); the pre-existing
      # integration tests spin up a MongoDB testcontainer — Docker ships on ubuntu runners.
      - name: Run integration tests
        run: uv run pytest -m integration

  driver-parity:
    name: Turso driver parity (libsql)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies (+ libsql)
        run: |
          uv sync
          uv pip install libsql

      # Re-run the adapter + repository contract suite through the libsql driver (on a local
      # file DB) to catch any transaction / affected-row / parameter-binding divergence
      # from stdlib sqlite3. TRIP_DB_FORCE_BACKEND routes open_connection() to libsql.
      - name: Adapter + repository suite on libsql
        env:
          TRIP_DB_FORCE_BACKEND: libsql
        run: uv run pytest -m integration tests/core/turso tests/trips/test_repository.py tests/trips/editing/test_service_integration.py
