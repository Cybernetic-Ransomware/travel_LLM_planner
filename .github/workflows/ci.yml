name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: ruff format check
        run: uv run ruff format --check src/

      - name: ruff lint
        run: uv run ruff check src/

      - name: ty type check
        run: uv run ty check

      - name: codespell
        run: uv run python -m codespell_lib src/

  compose-validate:
    name: Validate Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Compose environment
        run: cp docker/.env.template docker/.env

      - name: Validate merged compose config
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.dev.yml \
            config --quiet

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest -m unit
