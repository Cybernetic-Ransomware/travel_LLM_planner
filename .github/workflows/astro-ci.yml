name: Astro CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/astro-frontend/**"
      - "src/main.py"
      - "src/config/config.py"
      - "docker/.env.template"
      - ".github/workflows/astro-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/astro-frontend/**"
      - "src/main.py"
      - "src/config/config.py"
      - "docker/.env.template"
      - ".github/workflows/astro-ci.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  astro:
    name: Check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/astro-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/astro-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check + svelte-check)
        run: npm run check

      - name: Build
        run: npm run build
